## 💾 Memory System

Stores user chat history:

```text
database/memory.json
```

Example structure:

```json
{
  "user123": [
    "hello",
    "what is anime?",
    "tell me a joke"
  ]
}
```

---

## 📱 WhatsApp Connection

Uses Baileys:

```javascript
const { useMultiFileAuthState } = require("@whiskeysockets/baileys");
```

Session folder:

```text
/session
```

✔ Saves login after first QR scan  
✔ Auto reconnect supported  

---

## ⚡ Message Flow

```text
User Message
   ↓
index.js listener
   ↓
Command check (!prefix)
   ↓
Route to module (anime / ai / fun)
   ↓
Send WhatsApp response
```

