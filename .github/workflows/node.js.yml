# 🧠⚡ Tensura Anime Bot — Node.js Documentation

This file explains how the Tensura Anime Bot is built using Node.js.

---

## 🚀 Runtime

- Node.js 18+
- WhatsApp Web API (Baileys)
- Event-driven architecture

---

## ⚙️ Main Entry File

```text
index.js
```

This file:
- Starts WhatsApp connection
- Loads session
- Handles messages
- Routes commands to modules

---

## 🧠 Core Bot Logic

The bot listens for messages using Baileys:

```javascript
sock.ev.on("messages.upsert", async ({ messages }) => {
  const msg = messages[0];

  if (!msg.message) return;

  const text =
    msg.message.conversation ||
    msg.message.extendedTextMessage?.text ||
    "";

  console.log("Message received:", text);
});
```

---

## 🧩 Command System

Commands are modular:

```text
commands/
├── anime.js
├── ai.js
├── group.js
├── fun.js
├── economy.js
```

Each file exports a function:

```javascript
module.exports = async (sock, from, text) => {
  if (text === "!ping") {
    await sock.sendMessage(from, { text: "🏓 Pong!" });
  }
};
```

---

## 🧠 AI System (Great Sage)

AI is handled in:

```text
ai/greatSage.js
```

Example:

```javascript
async function askSage(prompt) {
  return "🧠 Great Sage: " + prompt;
}
```

Used in:

```text
!sage <question>
```

